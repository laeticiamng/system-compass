name: CI Pipeline

# Gestionnaire de paquets : bun, avec bun.lock figé.
# bun.lock est le fichier de verrouillage tenu à jour par Lovable ; package-lock.json
# est resté figé depuis mars 2026 (lenis, zustand, web-vitals, @playwright/test,
# @axe-core/playwright absents, jspdf et @lovable.dev/cloud-auth-js en retard),
# ce qui faisait échouer `npm ci` (ERESOLVE) avant même le premier contrôle.
#
# Aucun secret n'est nécessaire : les tests unitaires simulent Supabase et le build
# Vite n'exige pas les variables VITE_SUPABASE_* (vérifié sans fichier .env).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies (lockfile figé)
        run: bun install --frozen-lockfile

      - name: Lint (ESLint + routage i18n)
        run: npm run lint

      # Le tsconfig.json racine a `files: []` : `tsc --noEmit` à la racine ne
      # vérifiait aucun fichier. On vérifie explicitement chaque projet.
      - name: Type check (application)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Type check (configuration Vite)
        run: npx tsc -p tsconfig.node.json --noEmit

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          echo "📦 Bundle size report:"
          du -sh dist/
          du -sh dist/assets/*.js | sort -rh | head -10

  i18n-check:
    name: i18n Completeness Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Les scripts i18n n'utilisent que des modules natifs de Node :
      # aucune installation de dépendances n'est nécessaire.
      - name: Check duplicate JSON keys
        run: node scripts/check-duplicate-keys.js

      - name: Check translation patterns
        run: node scripts/check-translation-patterns.js

      - name: Check translation keys
        run: node scripts/check-translation-keys.js

      - name: Check all translations (general + countries)
        run: node scripts/check-translations.js

      - name: Generate i18n coverage report
        run: node scripts/generate-i18n-coverage.js

      - name: Upload coverage badges
        uses: actions/upload-artifact@v4
        with:
          name: i18n-badges
          path: .github/badges/
          retention-days: 30

  update-badges:
    name: Update i18n Badges
    runs-on: ubuntu-latest
    needs: i18n-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate i18n coverage
        run: node scripts/generate-i18n-coverage.js

      - name: Commit badge updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/
          git diff --staged --quiet || git commit -m "chore: update i18n coverage badges [skip ci]"
          git push

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies (lockfile figé)
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
